<title>Scale Practice</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@300;400;600&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0c;
    --surface: #111115;
    --surface2: #1a1a20;
    --border: #2a2a35;
    --accent: #e8c84a;
    --accent2: #4ae8c8;
    --accent3: #e84a8a;
    --text: #e8e8f0;
    --text-dim: #6a6a80;
    --text-muted: #3a3a50;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    height: 100dvh;
    overflow: hidden;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    display: flex;
    flex-direction: column;
    max-height: 100dvh;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(232,200,74,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(232,200,74,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* ===== HEADER ===== */
  header {
    position: relative;
    z-index: 10;
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    background: var(--bg);
  }

  header h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 24px;
    letter-spacing: 4px;
    color: var(--accent);
  }

  .menu-btn {
    width: 44px; height: 44px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text-dim);
    border-radius: 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    cursor: pointer;
  }

  .menu-btn span {
    display: block;
    width: 18px; height: 1.5px;
    background: currentColor;
    transition: all 0.2s;
  }

  .menu-btn.open span:nth-child(1) { transform: rotate(45deg) translate(4.5px, 4.5px); }
  .menu-btn.open span:nth-child(2) { opacity: 0; }
  .menu-btn.open span:nth-child(3) { transform: rotate(-45deg) translate(4.5px, -4.5px); }

  /* ===== DRAWER ===== */
  .drawer-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
  }
  .drawer-overlay.open { opacity: 1; pointer-events: all; }

  .drawer {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: min(320px, 85vw);
    background: var(--surface);
    border-left: 1px solid var(--border);
    z-index: 60;
    transform: translateX(100%);
    transition: transform 0.25s cubic-bezier(0.4,0,0.2,1);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .drawer.open { transform: translateX(0); }

  .drawer-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .drawer-title {
    font-size: 13px;
    letter-spacing: 3px;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  .drawer-close {
    width: 44px; height: 44px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text-dim);
    border-radius: 4px;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .drawer-body {
    overflow-y: auto;
    flex: 1;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 20px;
  }

  /* ===== SIDEBAR SECTIONS ===== */
  .sidebar-section { border-bottom: 1px solid var(--border); }

  .sidebar-section-header {
    padding: 16px 20px;
    font-size: 13px;
    letter-spacing: 2px;
    color: var(--text-dim);
    text-transform: uppercase;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    user-select: none;
  }

  .sidebar-section-body {
    padding: 8px 16px 16px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
  }
  .sidebar-section-body.single-col { grid-template-columns: 1fr; }
  .sidebar-section-body.collapsed { display: none; }

  .check-item {
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    padding: 10px 8px;
    border-radius: 4px;
    min-height: 48px;
  }

  .check-item input[type=checkbox] {
    appearance: none;
    width: 22px; height: 22px;
    border: 1px solid var(--border);
    border-radius: 3px;
    background: var(--surface);
    cursor: pointer;
    position: relative;
    flex-shrink: 0;
  }

  .check-item input[type=checkbox]:checked {
    background: var(--accent);
    border-color: var(--accent);
  }

  .check-item input[type=checkbox]:checked::after {
    content: '';
    position: absolute;
    left: 5px; top: 2px;
    width: 8px; height: 12px;
    border: 2px solid #000;
    border-top: none; border-left: none;
    transform: rotate(45deg);
  }

  .check-item label {
    font-size: 16px;
    color: var(--text-dim);
    cursor: pointer;
    line-height: 1.3;
    font-family: 'Noto Sans JP', sans-serif;
  }

  .check-item input:checked ~ label { color: var(--text); }

  .select-all-btn {
    margin: 8px 16px 0;
    font-size: 13px;
    color: var(--text-muted);
    cursor: pointer;
    background: none;
    border: none;
    font-family: inherit;
    padding: 8px 0;
    letter-spacing: 1px;
  }

  /* ===== STAGE ===== */
  .stage {
    position: relative;
    z-index: 1;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 10px 14px;
    overflow: hidden;
    gap: 10px;
    min-height: 0;
  }

  .empty-state {
    display: none;
  }

  .topic-card {
    width: 100%;
    max-width: 480px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 14px 16px 14px;
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
  }

  .topic-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3));
  }

  .topic-label {
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .topic-key {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(56px, 18vw, 84px);
    line-height: 1;
    color: var(--accent);
    letter-spacing: 4px;
    text-shadow: 0 0 40px rgba(232,200,74,0.3);
  }
  .topic-key.sharp { color: var(--accent3); text-shadow: 0 0 40px rgba(232,74,138,0.3); }
  .topic-key.flat  { color: var(--accent2); text-shadow: 0 0 40px rgba(74,232,200,0.3); }

  .key-accidental {
    font-size: 0.55em;
    vertical-align: super;
    line-height: 0;
  }

  .topic-scale {
    font-size: clamp(15px, 4.2vw, 22px);
    color: var(--text);
    font-weight: 300;
    margin-top: 2px;
    font-family: 'Noto Sans JP', sans-serif;
  }

  .topic-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }

  .topic-item-label {
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-bottom: 3px;
  }

  .topic-item-value {
    word-break: keep-all;
    white-space: normal;
    font-size: 15px;
    color: var(--accent2);
    font-family: 'Noto Sans JP', sans-serif;
    line-height: 1.35;
    min-height: 2.7em;
  }

  .topic-bpm {
    font-size: 38px;
    color: var(--accent3);
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 2px;
  }

  .generate-btn {
    width: 100%;
    max-width: 480px;
    height: var(--btn-h);
    flex-shrink: 0;
    background: transparent;
    color: var(--accent);
    border: 2px solid var(--accent);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    letter-spacing: 4px;
    cursor: pointer;
    border-radius: 4px;
    touch-action: manipulation;
    transition: all 0.1s;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .generate-btn:active {
    background: var(--accent);
    color: #000;
    transform: scale(0.98);
  }

  @keyframes flash {
    0%   { opacity: 1; }
    40%  { opacity: 0.2; }
    100% { opacity: 1; }
  }
  .topic-card.flashing { animation: flash 0.18s ease; }

  /* ===== METRONOME ===== */
  .metronome-bar {
    position: relative;
    z-index: 10;
    flex-shrink: 0;
    background: var(--surface);
    border-top: 2px solid var(--border);
    padding: 12px 16px;
    padding-bottom: calc(12px + var(--safe-bottom));
  }

  /* ===== METRONOME共通高さ ===== */
  :root { --btn-h: 44px; }

  .time-sig-btn {
    height: var(--btn-h);
    flex: 1;
    padding: 0 4px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text-muted);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 15px;
    letter-spacing: 1px;
    border-radius: 4px;
    cursor: pointer;
    touch-action: manipulation;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .time-sig-btn.active {
    border-color: var(--accent2);
    color: var(--accent2);
    background: rgba(74,232,200,0.08);
  }

  .metro-time-sig {
    display: flex;
    gap: 4px;
    margin-bottom: 10px;
  }

  .metro-top {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-bottom: 10px;
  }

  .beat-dot {
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--border);
    transition: background 0.05s, box-shadow 0.05s;
    flex-shrink: 0;
  }
  .beat-dot.active {
    background: var(--accent);
    box-shadow: 0 0 14px rgba(232,200,74,0.9);
  }
  .beat-dot.active.accent-beat {
    background: var(--accent3);
    box-shadow: 0 0 20px 4px rgba(232,74,138,0.95);
  }

  .metro-bottom {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: stretch;
    gap: 6px;
  }

  .metro-btn-group {
    display: flex;
    gap: 4px;
    align-items: stretch;
  }

  .metro-btn {
    height: auto;
    min-height: var(--btn-h);
    min-width: 44px;
    flex: 1;
    padding: 0 6px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text-dim);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    cursor: pointer;
    border-radius: 4px;
    touch-action: manipulation;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .metro-btn:active { border-color: var(--accent); color: var(--accent); }

  .metro-bpm-center {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }

  .metro-bpm-wrap {
    display: flex;
    align-items: stretch;
    gap: 4px;
  }

  .bpm-lock-btn {
    width: var(--btn-h);
    height: auto;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text-muted);
    border-radius: 4px;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
    transition: all 0.15s;
    flex-shrink: 0;
  }

  .bpm-lock-btn.locked {
    border-color: var(--accent3);
    color: var(--accent3);
    background: rgba(232,74,138,0.1);
  }

  .metro-bpm-input {
    width: 76px; height: var(--btn-h);
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--accent);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    text-align: center;
    letter-spacing: 2px;
    border-radius: 4px;
    outline: none;
    -webkit-appearance: none;
  }
  .metro-bpm-input:focus { border-color: var(--accent); }

  .metro-bpm-unit {
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 1px;
    text-align: center;
    margin-top: 2px;
  }

  .metro-play-btn {
    width: 100%;
    padding: 16px;
    border: none;
    background: var(--accent);
    color: #000;
    font-size: 22px;
    cursor: pointer;
    border-radius: 4px;
    touch-action: manipulation;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 10px;
    transition: all 0.1s;
  }
  .metro-play-btn.playing {
    background: var(--accent3);
    box-shadow: 0 0 18px rgba(232,74,138,0.5);
  }

  .drawer-body::-webkit-scrollbar { width: 3px; }
  .drawer-body::-webkit-scrollbar-track { background: transparent; }
  .drawer-body::-webkit-scrollbar-thumb { background: var(--border); }

/* ===== 指板ダイアグラム ===== */

* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #1a1a2e; font-family: 'Helvetica Neue', Arial, sans-serif; padding: 20px 12px; min-height: 100vh; }
.label-sub { color: #888; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 6px; }
.title { color: #fff; font-size: 16px; font-weight: 700; margin-bottom: 14px; }
.scale-select { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.scale-btn { background: #2e2e48; color: #9090b8; border: 1px solid #44446a; border-radius: 6px; padding: 5px 10px; font-size: 11px; font-weight: 600; cursor: pointer; }
.scale-btn.active { background: #4a6aaa; color: #fff; border-color: #6a8acc; box-shadow: 0 0 8px rgba(74,106,170,0.4); }
.key-row { display: flex; gap: 5px; margin-bottom: 14px; flex-wrap: wrap; }
.key-btn { background: #2e2e48; color: #9090b8; border: 1px solid #44446a; border-radius: 6px; padding: 5px 10px; font-size: 12px; font-weight: 700; cursor: pointer; min-width: 36px; text-align: center; }
.key-btn.active { background: #1a7a4a; color: #fff; border-color: #22a060; box-shadow: 0 0 8px rgba(26,122,74,0.5); }
.position-select { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.pos-btn { background: #2e2e48; color: #9090b8; border: 1px solid #44446a; border-radius: 6px; padding: 5px 10px; font-size: 11px; font-weight: 600; cursor: pointer; }
.pos-btn.active { background: #d03890; color: #fff; border-color: #e050a8; box-shadow: 0 0 8px rgba(208,56,144,0.4); }
.scroll-hint { color: #555; font-size: 10px; margin-bottom: 8px; letter-spacing: 1px; }
.fretboard-scroll { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.fretboard { display: inline-block; background: #22223a; border-radius: 10px; padding: 14px 10px 30px 10px; }
table { border-collapse: collapse; table-layout: fixed; }
tr.string-row td { position: relative; width: 44px; height: 36px; text-align: center; vertical-align: middle; padding: 0; }
tr.string-row td::after { content: ''; position: absolute; top: 50%; left: 0; right: 0; height: 1.5px; background: rgba(200,180,140,0.3); z-index: 0; transform: translateY(-50%); pointer-events: none; }
tr.string-row td:not(.open-cell)::before { content: ''; position: absolute; top: 0; left: 0; bottom: 0; width: 2px; background: rgba(180,160,120,0.2); z-index: 0; pointer-events: none; }
.open-cell { width: 38px; }
.cell-inner { position: relative; z-index: 1; display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 26px; border-radius: 5px; font-size: 10px; font-weight: 700; background: #33334d; color: #c8c8e8; border: 1px solid #44446a; }
.open-cell .cell-inner { width: 28px; background: #1e1e32; border-color: #2e2e48; color: #999; font-size: 9px; }
.tonic .cell-inner { background: #d03890; color: #fff; border-color: #e050a8; box-shadow: 0 0 7px rgba(208,56,144,0.5); }
.highlight-cell .cell-inner { border: 2px solid #00ccff !important; box-shadow: 0 0 6px rgba(0,204,255,0.5); }
.empty .cell-inner { background: transparent; border-color: transparent; color: transparent; }
tr.fret-num-row td { height: 22px; text-align: center; font-size: 10px; color: #aaa; font-weight: 600; vertical-align: middle; padding-top: 4px; }
tr.fret-num-row td::before, tr.fret-num-row td::after { display: none !important; }
.string-label { width: 20px !important; text-align: right; padding-right: 4px !important; }
.string-label::before, .string-label::after { display: none !important; }
.string-label .cell-inner { background: transparent; border-color: transparent; color: #555; font-size: 9px; width: 18px; height: 22px; }

</style>
</head>

<!-- 指板ダイアグラム モーダル -->
<div id="diagram-modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:1000;overflow-y:auto;">
  <div style="max-width:900px;margin:0 auto;padding:16px 12px 40px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <div style="color:#888;font-size:11px;letter-spacing:2px;text-transform:uppercase;">答え合わせ</div>
      <button onclick="closeDiagram()" style="background:#2e2e48;color:#fff;border:1px solid #44446a;border-radius:6px;padding:6px 14px;font-size:13px;cursor:pointer;">✕ 閉じる</button>
    </div>
    <div id="diagram-title" style="color:#fff;font-size:16px;font-weight:700;margin-bottom:16px;"></div>
    <div class="scroll-hint" style="color:#555;font-size:10px;margin-bottom:8px;letter-spacing:1px;">← スクロールで全フレットを確認 →</div>

</div>

<div class="drawer-overlay" id="overlay" onclick="closeDrawer()"></div>

<div class="drawer" id="drawer">

    <span class="drawer-title">// Settings</span>
    <button class="drawer-close" onclick="closeDrawer()">✕</button>
  </div>
  <div class="drawer-body">

    <div class="sidebar-section">
      <div class="sidebar-section-header" onclick="toggleSection('keys')">
        <span>Key</span><span id="toggle-keys">▾</span>
      </div>
      <button class="select-all-btn" onclick="toggleAll('key')">全選択 / 全解除</button>

    <div class="sidebar-section">
      <div class="sidebar-section-header" onclick="toggleSection('positions')">
        <span>Start Position</span><span id="toggle-positions">▾</span>
      </div>
      <button class="select-all-btn" onclick="toggleAll('position')">全選択 / 全解除</button>
      <div class="sidebar-section-body single-col" id="body-positions"></div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-section-header" onclick="toggleSection('scales')">
        <span>Scale</span><span id="toggle-scales">▾</span>
      </div>
      <button class="select-all-btn" onclick="toggleAll('scale')">全選択 / 全解除</button>
      <div class="sidebar-section-body single-col" id="body-scales"></div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-section-header" onclick="toggleSection('phrases')">
        <span>Phrase (Non-penta)</span><span id="toggle-phrases">▾</span>
      </div>
      <button class="select-all-btn" onclick="toggleAll('phrase')">全選択 / 全解除</button>
      <div class="sidebar-section-body single-col" id="body-phrases"></div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-section-header" onclick="toggleSection('penta-phrases')">
        <span>Phrase (Penta)</span><span id="toggle-penta-phrases">▾</span>
      </div>
      <button class="select-all-btn" onclick="toggleAll('pentaPhrase')">全選択 / 全解除</button>
      <div class="sidebar-section-body single-col" id="body-penta-phrases"></div>
    </div>

  </div>
</div>

<header>
  <h1>Scale Practice</h1>
  <span style="font-size:10px;color:var(--text-muted);letter-spacing:1px;font-family:monospace;">v1.0</span>
  <button class="menu-btn" id="menu-btn" onclick="toggleDrawer()">
    <span></span><span></span><span></span>
  </button>
</header>

<div class="stage" id="stage">

    <div class="big-text">READY</div>
    <p>TAP TO GENERATE</p>
  </div>

  <div class="topic-card" id="topic-card">
    <div class="topic-label">// Topic</div>
    <div class="topic-key" id="t-key" style="color:var(--border)">—</div>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
      <div class="topic-scale" id="t-scale" style="color:var(--text-muted);flex:1">TAP GENERATE</div>
      <button id="answer-btn" onclick="showDiagram()" style="
        display:none;
        flex-shrink:0;
        padding:8px 14px;
        background:rgba(0,204,255,0.1);
        border:1.5px solid #00ccff;
        color:#00ccff;
        font-size:12px;
        letter-spacing:1px;
        border-radius:6px;
        cursor:pointer;
        font-weight:700;
        white-space:nowrap;
      ">指板 ▸</button>
    </div>
    <div class="topic-grid">
      <div class="topic-item">
        <div class="topic-item-label">Position</div>
        <div class="topic-item-value" id="t-position" style="color:var(--text-muted)">—</div>
      </div>
      <div class="topic-item">
        <div class="topic-item-label">Phrase</div>
        <div class="topic-item-value" id="t-phrase" style="color:var(--text-muted); min-height:2.7em">—</div>
      </div>
      <div class="topic-item" style="grid-column:1/-1">
        <div class="topic-item-label">BPM</div>
        <div class="topic-bpm" id="t-bpm" style="color:var(--text-muted)">—</div>
      </div>
    </div>
  </div>

</div>

<button class="generate-btn" id="gen-btn" onclick="generate()" style="width:calc(100% - 28px);max-width:480px;margin:0 auto 8px;display:block;">
  GENERATE
</button>

<div class="metronome-bar">
  <div class="metro-time-sig">
    <button class="time-sig-btn" onclick="setTimeSig(1)" id="ts-1">1/1</button>
    <button class="time-sig-btn" onclick="setTimeSig(3)" id="ts-3">3/4</button>
    <button class="time-sig-btn active" onclick="setTimeSig(4)" id="ts-4">4/4</button>
    <button class="time-sig-btn" onclick="setTimeSig(5)" id="ts-5">5/4</button>
    <button class="time-sig-btn" onclick="setTimeSig(6)" id="ts-6">6/8</button>
    <button class="time-sig-btn" onclick="setTimeSig(7)" id="ts-7">7/4</button>
  </div>
  <div class="metro-top" id="beat-display"></div>
  <div class="metro-bottom">
    <div class="metro-btn-group">
      <button class="metro-btn" onclick="changeBpm(-5)">−5</button>
      <button class="metro-btn" onclick="changeBpm(-1)">−</button>
    </div>
    <div class="metro-bpm-center">
      <div class="metro-bpm-wrap">
        <input class="metro-bpm-input" id="bpm-input" type="number"
          value="100" min="40" max="240"
          onchange="setBpmFromInput()" oninput="setBpmFromInput()">
        <button class="bpm-lock-btn" id="bpm-lock-btn" onclick="toggleBpmLock()" title="BPM固定">🔓</button>
      </div>
      <span class="metro-bpm-unit">BPM</span>
    </div>
    <div class="metro-btn-group">
      <button class="metro-btn" onclick="changeBpm(1)">＋</button>
      <button class="metro-btn" onclick="changeBpm(5)">＋5</button>
    </div>
  </div>
  <button class="metro-play-btn" id="play-btn" onclick="toggleMetronome()">▶</button>
</div>

<script>
const KEYS = ['Cb','C','C#','Db','D','D#','Eb','E','F','F#','Gb','G','G#','Ab','A','A#','Bb','B'];
const POSITIONS = ['6弦 人差し指','6弦 中(薬)指','6弦 小指','5弦 人差し指','5弦 中(薬)指','5弦 小指','4弦 人差し指'];
const SCALES_PENTA = ['メジャーペンタ','マイナーペンタ','雲井ペンタ','m7b5ペンタ'];
const SCALES_NON_PENTA = ['メジャー','マイナー','リディアン','ドリアン','ミクソリディアン','メロディックマイナー','リディアンフラットセブン','オルタード','ロクリアンナチュラルナイン'];
const ALL_SCALES = [...SCALES_NON_PENTA, ...SCALES_PENTA];
const PHRASES_NON_PENTA = ['2度インターバル','3度インターバル','4度インターバル','4度インターバル(インバージョン)','5度インターバル','5度インターバル(インバージョン)','6度インターバル'];
const PHRASES_PENTA = ['パターン１','パターン２','パターン３','パターン４'];

const state = {
  key: new Set(KEYS),
  position: new Set(POSITIONS),
  scale: new Set(ALL_SCALES),
  phrase: new Set(PHRASES_NON_PENTA),
  pentaPhrase: new Set(PHRASES_PENTA),
};

function buildCheckboxes(id, items, key) {
  const el = document.getElementById(id);
  el.innerHTML = '';
  items.forEach(item => {
    const cid = `cb-${key}-${item.replace(/[\s()]/g,'_')}`;
    const div = document.createElement('div');
    div.className = 'check-item';
    div.innerHTML = `<input type="checkbox" id="${cid}" checked onchange="toggleItem('${key}','${item}',this.checked)"><label for="${cid}">${item}</label>`;
    el.appendChild(div);
  });
}

buildCheckboxes('body-keys', KEYS, 'key');
buildCheckboxes('body-positions', POSITIONS, 'position');
buildCheckboxes('body-scales', ALL_SCALES, 'scale');
buildCheckboxes('body-phrases', PHRASES_NON_PENTA, 'phrase');
buildCheckboxes('body-penta-phrases', PHRASES_PENTA, 'pentaPhrase');

function toggleItem(key, item, checked) {
  checked ? state[key].add(item) : state[key].delete(item);
}

function toggleAll(key) {
  const map = { key:KEYS, position:POSITIONS, scale:ALL_SCALES, phrase:PHRASES_NON_PENTA, pentaPhrase:PHRASES_PENTA };
  const items = map[key];
  const allOn = items.every(i => state[key].has(i));
  items.forEach(i => {
    const cid = `cb-${key}-${i.replace(/[\s()]/g,'_')}`;
    const el = document.getElementById(cid);
    if (allOn) { state[key].delete(i); if(el) el.checked=false; }
    else        { state[key].add(i);    if(el) el.checked=true; }
  });
}

function toggleSection(name) {
  const bodyId = {'keys':'body-keys','positions':'body-positions','scales':'body-scales','phrases':'body-phrases','penta-phrases':'body-penta-phrases'}[name];
  const body = document.getElementById(bodyId);
  const tog  = document.getElementById(`toggle-${name}`);
  if (!body) return;
  body.classList.toggle('collapsed');
  tog.textContent = body.classList.contains('collapsed') ? '▸' : '▾';
}

// Tap stage to generate (not on buttons/drawer)
document.getElementById('stage').addEventListener('click', function(e) {
  if (e.target.closest('button') || e.target.closest('.drawer')) return;
  generate();
});

function pickRandom(arr) { return arr[Math.floor(Math.random()*arr.length)]; }

function generate() {
  const keys = [...state.key], positions = [...state.position], scales = [...state.scale];
  if (!keys.length || !positions.length || !scales.length) { alert('各カテゴリで最低1つ選択してください'); return; }

  const key = pickRandom(keys);
  const position = pickRandom(positions);
  const scale = pickRandom(scales);
  const isPenta = SCALES_PENTA.includes(scale);
  const phrArr = isPenta ? [...state.pentaPhrase] : [...state.phrase];
  const phrase = phrArr.length ? pickRandom(phrArr) : '—';
  const bpmVal = Math.floor(Math.random()*31)+90;

  const keyEl = document.getElementById('t-key');
  const displayKey = key.replace('b', '<span class="key-accidental">♭</span>').replace('#', '<span class="key-accidental">♯</span>');
  keyEl.innerHTML = displayKey;
  keyEl.className = 'topic-key';
  keyEl.style.color = '';
  if (key.includes('#')) keyEl.classList.add('sharp');
  else if (key.includes('b') && key !== 'B') keyEl.classList.add('flat');

  const scaleEl = document.getElementById('t-scale');
  scaleEl.textContent = scale;
  scaleEl.style.color = '';

  const posEl = document.getElementById('t-position');
  posEl.textContent = position;
  posEl.style.color = '';

  const phraseEl = document.getElementById('t-phrase');
  phraseEl.innerHTML = phrase.replace('(インバージョン)', '<br><span style="font-size:0.85em;opacity:0.8">(インバージョン)</span>');
  phraseEl.style.color = '';

  const bpmEl = document.getElementById('t-bpm');
  bpmEl.textContent = bpmLocked ? bpm : bpmVal;
  bpmEl.style.color = '';

  const card = document.getElementById('topic-card');
  card.classList.remove('flashing');
  void card.offsetWidth;
  card.classList.add('flashing');

  if (!bpmLocked) setBpm(bpmVal);

  // 答え合わせボタン表示
  document.getElementById('answer-btn').style.display = 'block';
}

// ===== METRONOME =====
let audioCtx=null, isPlaying=false, bpm=100, nextNoteTime=0, currentBeat=0, timerID=null;
let beats=4;
const AHEAD=0.1, LOOKAHEAD=25;

function buildDots() {
  const container = document.getElementById('beat-display');
  container.innerHTML = '';
  for (let i=0; i<beats; i++) {
    const d = document.createElement('div');
    d.className = 'beat-dot';
    d.id = `dot-${i}`;
    container.appendChild(d);
  }
}

function setTimeSig(n) {
  beats = n;
  // update button styles
  [1,3,4,5,6,7].forEach(x => {
    const btn = document.getElementById(`ts-${x}`);
    if (btn) btn.classList.toggle('active', x===n);
  });
  buildDots();
  if (isPlaying) {
    stopMetronome();
    startMetronome();
  }
}

// init dots
buildDots();

function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}

function scheduleClick(beat, time) {
  const ctx = getCtx();
  const isAccent = beat === 0;

  // --- ノイズバースト（スティックのアタック感）---
  const bufSize = ctx.sampleRate * 0.04;
  const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1);

  const noise = ctx.createBufferSource();
  noise.buffer = buf;

  const noiseFilter = ctx.createBiquadFilter();
  noiseFilter.type = 'bandpass';
  noiseFilter.frequency.value = isAccent ? 2800 : 2000;
  noiseFilter.Q.value = 0.8;

  const noiseGain = ctx.createGain();
  noiseGain.gain.setValueAtTime(isAccent ? 0.6 : 0.35, time);
  noiseGain.gain.exponentialRampToValueAtTime(0.001, time + 0.03);

  noise.connect(noiseFilter);
  noiseFilter.connect(noiseGain);
  noiseGain.connect(ctx.destination);
  noise.start(time);
  noise.stop(time + 0.04);

  // --- トーン成分（木の響き）---
  const osc = ctx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(isAccent ? 900 : 600, time);
  osc.frequency.exponentialRampToValueAtTime(isAccent ? 300 : 200, time + 0.04);

  const oscGain = ctx.createGain();
  oscGain.gain.setValueAtTime(isAccent ? 0.4 : 0.25, time);
  oscGain.gain.exponentialRampToValueAtTime(0.001, time + 0.06);

  osc.connect(oscGain);
  oscGain.connect(ctx.destination);
  osc.start(time);
  osc.stop(time + 0.07);
}

function scheduler() {
  const ctx = getCtx();
  while (nextNoteTime < ctx.currentTime + AHEAD) {
    scheduleClick(currentBeat, nextNoteTime);
    const beat = currentBeat;
    const delay = (nextNoteTime - ctx.currentTime) * 1000;
    setTimeout(() => flashBeat(beat), Math.max(0, delay));
    nextNoteTime += 60.0 / bpm;
    currentBeat = (currentBeat+1) % beats;
  }
  timerID = setTimeout(scheduler, LOOKAHEAD);
}

function flashBeat(beat) {
  for (let i=0; i<beats; i++) {
    const d = document.getElementById(`dot-${i}`);
    if (!d) continue;
    d.className = 'beat-dot';
    if (i===beat) { d.classList.add('active'); if(beat===0) d.classList.add('accent-beat'); }
  }
}

function startMetronome() {
  const ctx = getCtx();
  if (ctx.state==='suspended') ctx.resume();
  isPlaying=true; currentBeat=0;
  nextNoteTime = ctx.currentTime + 0.05;
  scheduler();
  const btn = document.getElementById('play-btn');
  btn.classList.add('playing'); btn.textContent='■';
}

function stopMetronome() {
  isPlaying=false; clearTimeout(timerID); timerID=null;
  for (let i=0; i<beats; i++) { const d=document.getElementById(`dot-${i}`); if(d) d.className='beat-dot'; }
  const btn = document.getElementById('play-btn');
  btn.classList.remove('playing'); btn.textContent='▶';
}

function toggleMetronome() { isPlaying ? stopMetronome() : startMetronome(); }

let bpmLocked = false;
function toggleBpmLock() {
  bpmLocked = !bpmLocked;
  const btn = document.getElementById('bpm-lock-btn');
  btn.textContent = bpmLocked ? '🔒' : '🔓';
  btn.classList.toggle('locked', bpmLocked);
}

function setBpm(val) {
  val = Math.max(40, Math.min(240, val));
  bpm = val;
  document.getElementById('bpm-input').value = val;
}

function changeBpm(delta) { setBpm(bpm+delta); }
function setBpmFromInput() { const v=parseInt(document.getElementById('bpm-input').value); if(!isNaN(v)) setBpm(v); }

var currentDiagramKey = 0;
var currentDiagramScale = 0;
var currentDiagramPos = 0;

function showDiagram() {
  var keyStr = document.getElementById('t-key').textContent.replace('♭','b').replace('♯','#');
  var scaleStr = document.getElementById('t-scale').textContent;
  var posStr = document.getElementById('t-position').textContent;

  // キーインデックス（シャープ→フラット変換も考慮）
  var KEY_ENHARMONIC = {
    'C#': 'Db', 'D#': 'Eb', 'F#': 'Gb', 'G#': 'Ab', 'A#': 'Bb',
    'Cb': 'B',  'Fb': 'E'
  };
  var keySearch = KEY_ENHARMONIC[keyStr] || keyStr;
  var keyIdx = 0;
  for (var i = 0; i < keys.length; i++) {
    if (keys[i].label === keyStr || keys[i].label === keySearch) { keyIdx = i; break; }
  }

  // スケールインデックス
  var scaleName = SCALE_NAME_MAP[scaleStr] || scaleStr;
  var scaleIdx = 0;
  for (var i = 0; i < scales.length; i++) {
    if (scales[i].name === scaleName) { scaleIdx = i; break; }
  }

  // ポジションインデックス（名前マッピング）
  var POS_NAME_MAP_7 = {
    '6弦 人差し指':  '6弦 人差し指(中指)スタート',
    '6弦 中(薬)指':  '6弦 中指(薬指)スタート',
    '6弦 小指':      '6弦 小指スタート',
    '5弦 人差し指':  '5弦 人差し指(中指)スタート',
    '5弦 中(薬)指':  '5弦 中指(薬指)スタート',
    '5弦 小指':      '5弦 小指スタート',
    '4弦 人差し指':  '4弦 人差し指(中指)スタート'
  };
  var POS_NAME_MAP_5 = {
    '6弦 人差し指':  '6弦 人差し指(中指)スタート',
    '6弦 小指':      '6弦 小指スタート',
    '5弦 人差し指':  '5弦 人差し指(中指)スタート',
    '5弦 小指':      '5弦 小指スタート',
    '4弦 人差し指':  '4弦 人差し指(中指)スタート'
  };
  var sc = scales[scaleIdx];
  var isPenta = sc.posOffsets.length === 5;
  var posNames = getPosNames(scaleIdx);
  var posMap = isPenta ? POS_NAME_MAP_5 : POS_NAME_MAP_7;
  var mappedPosStr = posMap[posStr] || posStr;
  var posIdx = 0;
  for (var i = 0; i < posNames.length; i++) {
    if (posNames[i] === mappedPosStr) { posIdx = i; break; }
  }

  currentDiagramKey = keyIdx;
  currentDiagramScale = scaleIdx;
  currentDiagramPos = posIdx;

  document.getElementById('diagram-modal').style.display = 'block';
  document.body.style.overflow = 'hidden';
  setTimeout(function() {
    buildDiagramBoard(posIdx, keyIdx, scaleIdx);
    // タイトルをお題のキー表記で上書き
    var sc = scales[scaleIdx];
    var posNames = getPosNames(scaleIdx);
    document.getElementById('diagram-title').textContent =
      sc.name + '  /  ' + keyStr + '  /  ' + posNames[posIdx];
  }, 50);
}

function closeDiagram() {
  document.getElementById('diagram-modal').style.display = 'none';
  document.body.style.overflow = '';
}

var currentScale = 0;
var openStrings = [4,11,7,2,9,4];
var FRETS = 18;
var positionNames7 = ['6弦 人差し指(中指)スタート','6弦 中指(薬指)スタート','6弦 小指スタート','5弦 人差し指(中指)スタート','5弦 中指(薬指)スタート','5弦 小指スタート','4弦 人差し指(中指)スタート'];
var positionNames5 = ['6弦 人差し指(中指)スタート','6弦 小指スタート','5弦 人差し指(中指)スタート','5弦 小指スタート','4弦 人差し指(中指)スタート'];
var currentKey = 0;
var currentPos = 0;
function getScaleMap(keyIdx, scaleIdx) {
  var k = keys[keyIdx];
  var sc = scales[scaleIdx];
  var names = k.useFlat ? noteNamesFlat : noteNamesSharp;
  var map = {};
  for (var i = 0; i < sc.steps.length; i++) {
    var noteIdx = (k.root + sc.steps[i]) % 12;
    map[names[noteIdx]] = {label: sc.intervals[i], tonic: i === 0};
  }
  return map;
}
function getCell(scaleMap, stringIdx, fret) {
  var noteIdx = (openStrings[stringIdx] + fret) % 12;
  return scaleMap[noteNamesSharp[noteIdx]] || scaleMap[noteNamesFlat[noteIdx]] || null;
}
function getTonicFret(posData, keyIdx) {
  var fret = posData.tonicFretC + keys[keyIdx].root;
  while (fret + posData.maxOff > FRETS) fret -= 12;
  while (fret + posData.minOff < 1)    fret += 12;
  return fret;
}
function getHlFrets(posData, keyIdx) {
  var tonicFret = getTonicFret(posData, keyIdx);
  var hl = [];
  for (var si = 0; si < 6; si++) {
    var arr = [];
    for (var j = 0; j < posData.offsets[si].length; j++) {
      var f = tonicFret + posData.offsets[si][j];
      if (f >= 1 && f <= FRETS) arr.push(f);
    }
    hl.push(arr);
  }
  return hl;
}
function buildDiagramBoard(posIdx, keyIdx, scaleIdx) {
  var table = document.getElementById('diagram-board');
  table.innerHTML = '';
  var sc = scales[scaleIdx];
  var names = sc.posOffsets.length === 5 ? positionNames5 : positionNames7;
  var pos = {name: names[posIdx]};
  var posData = sc.posOffsets[posIdx];
  var hl = getHlFrets(posData, keyIdx);
  var scaleMap = getScaleMap(keyIdx, scaleIdx);
  for (var si = 0; si < 6; si++) {
    var tr = document.createElement('tr');
    tr.className = 'string-row';
    var labelTd = document.createElement('td');
    labelTd.className = 'string-label';
    labelTd.innerHTML = '<span class="cell-inner">' + (si+1) + '</span>';
    tr.appendChild(labelTd);
    var openTd = document.createElement('td');
    openTd.className = 'open-cell';
    var cell0 = getCell(scaleMap, si, 0);
    if (cell0 && cell0.tonic) openTd.className += ' tonic';
    else if (!cell0) openTd.className += ' empty';
    openTd.innerHTML = '<span class="cell-inner">' + (cell0 ? cell0.label : '') + '</span>';
    tr.appendChild(openTd);
    for (var f = 1; f <= FRETS; f++) {
      var td = document.createElement('td');
      var cell = getCell(scaleMap, si, f);
      var isHL = hl[si] && hl[si].indexOf(f) !== -1;
      var cls = '';
      if (!cell) cls = 'empty';
      else if (cell.tonic) cls = 'tonic';
      if (isHL) cls = (cls ? cls + ' ' : '') + 'highlight-cell';
      td.className = cls;
      td.innerHTML = '<span class="cell-inner">' + (cell ? cell.label : '') + '</span>';
      tr.appendChild(td);
    }
    table.appendChild(tr);
  }
  var numRow = document.createElement('tr');
  numRow.className = 'fret-num-row';
  numRow.appendChild(document.createElement('td'));
  var onTd = document.createElement('td');
  onTd.textContent = '開放';
  onTd.style.cssText = 'font-size:8px;color:#444;';
  numRow.appendChild(onTd);
  for (var f2 = 1; f2 <= FRETS; f2++) {
    var ntd = document.createElement('td');
    ntd.textContent = f2;
    numRow.appendChild(ntd);
  }
  table.appendChild(numRow);
  document.getElementById('diagram-title').textContent =
    scales[scaleIdx].name + '  /  ' + keys[keyIdx].label + '  /  ' + pos.name;
  setTimeout(function() {
    var scrollArea = document.getElementById('diagram-scroll-area');
    var allHL = [];
    for (var i = 0; i < hl.length; i++) {
      for (var j = 0; j < hl[i].length; j++) allHL.push(hl[i][j]);
    }
    if (allHL.length === 0) return;
    var minFret = Math.min.apply(null, allHL);
    var maxFret = Math.max.apply(null, allHL);
    var firstRow = table.querySelector('tr.string-row');
    var tds = firstRow.querySelectorAll('td');
    var startTd = tds[minFret + 1];
    var endTd   = tds[maxFret + 1];
    if (startTd && endTd) {
      var center = startTd.offsetLeft + (endTd.offsetLeft + endTd.offsetWidth - startTd.offsetLeft) / 2;
      scrollArea.scrollLeft = Math.max(0, center - scrollArea.clientWidth / 2);
    }
  }, 50);
}

// ポジション名取得（モーダル用）
function getPosNames(scaleIdx) {
  var sc = scales[scaleIdx];
  return sc.posOffsets.length === 5 ? positionNames5 : positionNames7;
}




// 拍子リスト（順番通り）
const TIME_SIG_LIST = [1, 3, 4, 5, 6, 7];

document.addEventListener('keydown', e => {
  if (e.target.tagName==='INPUT') return;
  e.preventDefault();

  if (e.code==='Enter')       { generate(); }
  else if (e.code==='Space')  { toggleMetronome(); }
  else if (e.code==='KeyA')   { const btn = document.getElementById('answer-btn'); if (btn && btn.style.display !== 'none') showDiagram(); }
  else if (e.code==='Minus'   || e.code==='NumpadSubtract') { changeBpm(-1); }
  else if (e.code==='Equal'   || e.code==='NumpadAdd' || e.key==='+') { changeBpm(1); }
  else if (e.code==='Comma')  { changeBpm(-5); }
  else if (e.code==='Period') { changeBpm(5); }
  else if (e.code==='KeyR')   { toggleBpmLock(); }
  else if (e.code==='ArrowLeft') {
    const cur = TIME_SIG_LIST.indexOf(beats);
    if (cur > 0) setTimeSig(TIME_SIG_LIST[cur - 1]);
  }
  else if (e.code==='ArrowRight') {
    const cur = TIME_SIG_LIST.indexOf(beats);
    if (cur < TIME_SIG_LIST.length - 1) setTimeSig(TIME_SIG_LIST[cur + 1]);
  }
  else if (e.code==='KeyC' || e.code==='Escape') {
    if (document.getElementById('diagram-modal').style.display !== 'none') closeDiagram();
  }
});
